remediation: >
  Upgrade Firefox to version 128.0 ESR or later (enterprise) or 131.0+ (standard).
  For enterprise deployments, use Firefox ESR 128.x which provides long-term support.
  Deploy via WSUS, SCCM, Intune, or preferred software deployment tool.
  Priority: P0 EMERGENCY - CVE-2024-9680 is actively exploited (CISA KEV).

object_type_field: ObjectClass

data_source:
  type: collection
  description: "Windows installed software inventory via WMI Win32_Product"
  collection_method: "PowerShell Get-CimInstance Win32_Product"
  collection_script: "scripts/collect/windows/Collect-InstalledSoftware.ps1"
  prerequisites:
    - "Local administrator rights on target workstation"
    - "WMI enabled (Win32_Product class)"
  required_files:
    - pattern: "DATA_InstalledSoftware.json"
      object_class: "installed_software"
      description: "Windows installed software inventory"
  fields:
    - ObjectClass
    - Name
    - Version
    - Vendor
    - Hostname

object_detection:
  match:
    condition: or
    rules:
      - ObjectClass:
          eq: "installed_software"
      - ObjectClass:
          eq: "windows_application"
      - ObjectClass:
          eq: "Application"
  where:
    condition: and
    rules:
      # MOTOR_FIX_010 CONFORME : logique de detection AUDITABLE ici
      # Identifier Firefox par le nom du logiciel (collecte brute Win32_Product.Name)
      - Name:
          regex: '(?i)mozilla\s+firefox'
      # Comparer la version brute collectee - aucune logique CVE dans le script PowerShell
      # Firefox < 128.0 est vulnerable (baseline ESR 128 = version cible minimum entreprise)
      # Note: Win32_Product.Version retourne "127.0" ou "127.0.1" (2-3 segments)
      # version_lt gere les formats X.Y et X.Y.Z de facon semantiquement correcte
      - version_lt(Version, "128.0.0"):
          eq: true

output:
  fields:
    Hostname: Hostname
    Name: Name
    Version: Version
    Vendor: Vendor
    ObjectClass: ObjectClass

  computed:
    Severity: "if(version_lt(Version, '128.0.0'), 'CRITICAL - Firefox pre-ESR128 on ' + Hostname, 'SAFE')"
    RiskReason: "if(version_lt(Version, '128.0.0'), 'Firefox ' + Version + ' vulnerable to CVE-2024-9680 (CISA KEV) and multiple critical CVEs fixed in ESR 128', 'Firefox version is at or above ESR 128 baseline')"
    RecommendedAction: "if(version_lt(Version, '128.0.0'), 'URGENT: Upgrade Firefox to 128.0 ESR or later via software deployment tool', 'No action required')"
    DetectionLogic: "'Firefox Name regex match + version_lt(Version, 128.0.0) | Collected version: ' + Version"
    ComplianceImpact: "if(version_lt(Version, '128.0.0'), 'Non-compliant: Unpatched browser with CISA KEV CVE. Violates patch management policy.', 'Compliant')"

