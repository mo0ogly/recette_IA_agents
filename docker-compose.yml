# inspect_ia_agents recette discovery lab + governed-execution platform lab.
#
#   docker compose up discovery-mock        # start the mock Discovery :8081
#   docker compose run --rm recette         # run the discovery recette over HTTP
#   docker compose run --rm gates           # run the strict Python gates
#   docker compose run --rm tests           # run the full test suite
#   docker compose up -d lab-mock api       # start the platform lab (API :8090)
#   docker compose run --rm e2e             # end-to-end governed-flow recette
#
# discovery-mock + recette use the lean "runtime" image; gates + tests use the
# "audit" image (adds ruff/mypy/bandit/pytest + tests/ + scripts/). The mock is a
# lab double of the colleague's Discovery/Enrichment Plane, backed by the reference
# oracle. Swap INSPECT_IA_AGENTS_DISCOVERY_URL to point recette at the real service.

services:
  discovery-mock:
    build:
      context: .
      target: runtime
    image: ia_agent-recette:runtime
    command: python -m recette.discovery_mock
    # Host port is overridable so parallel sessions don't fight over 8081.
    # Default 8081 for interactive `make lab`; install.sh sets 0 (ephemeral).
    ports:
      - "${DISCOVERY_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  recette:
    build:
      context: .
      target: runtime
    image: ia_agent-recette:runtime
    depends_on:
      discovery-mock:
        condition: service_healthy
    environment:
      INSPECT_IA_AGENTS_DISCOVERY_URL: http://discovery-mock:8081
      INSPECT_IA_AGENTS_TENANT: dev
    command: python -m recette discovery --adapter http

  gates:
    build:
      context: .
      target: audit
    image: ia_agent-recette:audit
    command: >
      sh -c "ruff check recette tests scripts &&
             ruff format --check recette tests scripts &&
             mypy recette &&
             bandit -q -r recette --severity-level medium &&
             echo 'gates: PASS'"

  tests:
    build:
      context: .
      target: audit
    image: ia_agent-recette:audit
    command: python -m unittest discover -s tests

  # --- governed-execution platform lab (L1) ---

  # One-shot root chown: a fresh named volume mountpoint is root-owned, while
  # the runtime image runs as the non-root 'recette' user (least privilege).
  # The API service itself stays non-root.
  platform-init:
    build:
      context: .
      target: runtime
    image: ia_agent-recette:runtime
    user: root
    command: chown -R recette:recette /data
    volumes:
      - platform-data:/data

  # Lab double of the 11 external systems (recette/lab) -- the only place the
  # platform's side effects land (I5).
  lab-mock:
    build:
      context: .
      target: runtime
    image: ia_agent-recette:runtime
    command: python -m recette.lab.mock_server
    environment:
      INSPECT_IA_AGENTS_LAB_PORT: "8082"
    ports:
      - "${LAB_HOST_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # Gateway + Control/Audit Plane API. All state (event store, policies,
  # agent config) lives on the platform-data volume so it survives restarts (I1).
  api:
    build:
      context: .
      target: runtime
    image: ia_agent-recette:runtime
    command: python -m recette.api
    depends_on:
      lab-mock:
        condition: service_healthy
      platform-init:
        condition: service_completed_successfully
    environment:
      INSPECT_IA_AGENTS_API_HOST: 0.0.0.0
      INSPECT_IA_AGENTS_API_PORT: "8090"
      INSPECT_IA_AGENTS_LAB_URL: http://lab-mock:8082
      INSPECT_IA_AGENTS_EVENT_STORE_PATH: /data/events.db
      INSPECT_IA_AGENTS_POLICIES_DIR: /data/policies
      INSPECT_IA_AGENTS_CONFIG_PATH: /data/config.json
      # Per-backend API keys live on the persistent volume like the config, NOT
      # the ephemeral in-container default (/app/data): otherwise a key set via
      # the console is wiped on the next rebuild/restart ("my key is gone").
      INSPECT_IA_AGENTS_BACKEND_SECRETS_PATH: /data/backend_secrets.json
      # Proxy debug ON by default under Docker (the runtime of record, R27) so
      # the console App-traces panel is populated out of the box, matching what
      # the bare-host `platform up` already exports. Overridable per deployment.
      INSPECT_IA_AGENTS_PROXY_DEBUG: "${INSPECT_IA_AGENTS_PROXY_DEBUG:-on}"
    volumes:
      - platform-data:/data
    ports:
      - "${API_HOST_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # End-to-end governed-flow recette (tests/e2e) against the live api service.
  e2e:
    build:
      context: .
      target: audit
    image: ia_agent-recette:audit
    depends_on:
      api:
        condition: service_healthy
    environment:
      INSPECT_IA_AGENTS_E2E_API_URL: http://api:8090
    command: python -m unittest tests.e2e.test_governed_flow -v

  # --- OPTIONAL wire-interception overlay (mitmproxy) -----------------------
  # A real HTTP(S) interception proxy that captures the bytes on the wire of the
  # agent -> target-system traffic (the network-level view of the I5 side
  # effects). OFF by default: it lives behind the "wire" compose profile, so a
  # plain `up` never starts it. Observability only -- it never alters traffic;
  # its addon POSTs each flow to the API wire ring (POST /proxy/wire).
  #
  # network_mode: host because the platform runs on the HOST (./recette.sh
  # platform up): host networking lets mitmproxy bind :8083 on the host, reach
  # the host lab servers on 127.0.0.1:91xx, and POST back to the host API :8090,
  # all without container/host loopback translation (Linux). To route agents
  # through it: set INSPECT_IA_AGENTS_WIRE_PROXY=http://127.0.0.1:8083 for the API
  # process, then restart the API (./recette.sh api restart).
  wire-proxy:
    image: mitmproxy/mitmproxy:11.1.3
    profiles: ["wire"]
    network_mode: host
    command: >
      mitmdump --listen-host 127.0.0.1 --listen-port 8083
      --set stream_large_bodies=2m
      -s /addons/mitm_wire_addon.py
    environment:
      INSPECT_IA_AGENTS_API_URL: "${INSPECT_IA_AGENTS_API_URL:-http://127.0.0.1:8090}"
    volumes:
      - ./scripts/mitm_wire_addon.py:/addons/mitm_wire_addon.py:ro
      # Persist mitmproxy's home so its generated CA is readable host-side at
      # .run/mitmproxy/mitmproxy-ca-cert.pem -- trust it (INSPECT_IA_AGENTS_WIRE_CA)
      # to let the overlay decrypt HTTPS to real systems (real_saas). `./recette.sh
      # wire ca` prints the path.
      - ./.run/mitmproxy:/home/mitmproxy/.mitmproxy

  # --- OPTIONAL LLM gateway overlay (LiteLLM) -------------------------------
  # An OpenAI-compatible gateway that centralizes and observes the agents' model
  # calls (the "brain" view, as opposed to the wire overlay's target traffic).
  # OFF by default (compose profile "llm"). To use it: configure an inspect_ia_agents
  # ai_backend with provider "openai_compat" and base_url http://127.0.0.1:4000,
  # model = one of the model_name entries in config/litellm.config.yaml.
  #
  # Provider keys come from the environment (R8): the passthrough below forwards
  # them from the operator's shell / .env into the container, where the config
  # resolves them via os.environ/<KEY>. Empty defaults keep compose from failing
  # when a key is absent (that vendor's route just will not authenticate).
  llm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["llm"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${LLM_PROXY_HOST_PORT:-4000}:4000"
    volumes:
      - ./config/litellm.config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-recette-local}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

volumes:
  platform-data:
