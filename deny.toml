# cargo-deny policy for inspect_ia_agents (Railgun)
# Supply-chain gate used by /rust-recette Bloc D4 and the pre-commit hook.
# Format: cargo-deny v2 schema (graph/output + version = 2 sections).
# Run: cargo deny check advisories bans licenses sources
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the dependency graph for all targets by default. Narrow this to the
# platforms inspect_ia_agents actually ships on once the workspace targets are fixed
# (e.g. ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]).
all-features = true

[output]
feature-depth = 1

# --- Advisories (RustSec) -- equivalent of govulncheck -------------------
# v2: every advisory class (vulnerability, unmaintained, unsound, yanked) is
# denied by default. Grant time-boxed exceptions via `ignore` with a reason.
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Example exception format (keep empty unless a documented, tracked waiver exists):
# ignore = [
#   { id = "RUSTSEC-0000-0000", reason = "no upstream fix yet; tracked in ISSUE-123; re-evaluate 2026-09" },
# ]
ignore = []

# --- Licenses -- only permissive licenses allowed ------------------------
# v2: anything not in `allow` is denied. inspect_ia_agents is a private product, so we
# keep the allow-list tight to avoid copyleft contamination.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# Per-crate clarifications go here if a crate's license is mis-detected:
# [[licenses.clarify]]
# crate = "ring"
# expression = "MIT AND ISC AND OpenSSL"
# license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
# Do not flag our own unpublished workspace crates for license metadata.
ignore = true

# --- Bans -- duplicate versions, wildcards, banned crates ----------------
[bans]
multiple-versions = "warn"      # tighten to "deny" once the tree is deduplicated
wildcards = "deny"              # no `crate = "*"` deps (non-reproducible)
highlight = "all"
# Crates we never want pulled in (add as the threat model dictates):
deny = [
    # { crate = "openssl", reason = "prefer rustls for memory-safe TLS" },
]
# Crates allowed to appear in multiple versions (transitive churn we accept):
skip = []
skip-tree = []

# --- Sources -- only trusted registries / git ----------------------------
[sources]
unknown-registry = "deny"       # only crates.io unless explicitly allowed
unknown-git = "deny"            # no arbitrary git deps
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
