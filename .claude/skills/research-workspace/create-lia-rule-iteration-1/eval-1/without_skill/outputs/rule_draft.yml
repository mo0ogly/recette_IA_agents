description: |
  Detects Wing FTP Server installations vulnerable to CVE-2025-47812, a CVSS 10.0 CRITICAL
  unauthenticated Remote Code Execution vulnerability (Null Byte Lua Code Injection).

  The user and admin web interfaces mishandle null byte characters (\0) in the username field.
  The null byte terminates strlen() validation prematurely (CWE-158). Lua code following the
  null byte is written into the session file and executed by SessionModule.load() as root/SYSTEM.

  ATTACK FLOW:
  1. POST to /loginok.html with username="validuser\x00<lua_payload>"
  2. Null byte truncates authentication check - valid user portion passes
  3. Full username string written to session file
  4. SessionModule.load() executes session file - Lua payload triggers
  5. Arbitrary system commands execute via io.popen() as root/SYSTEM

  DETECTION LOGIC (MOTOR_FIX_010 compliant):
  - Collection: Collect-WingFTPServer.ps1 collects raw VersionNormalized field only
  - YAML Rule: version_lt(VersionNormalized, "7.4.4.0") detects vulnerable versions
  - No CVE flags pre-computed in PowerShell - logic fully auditable in this YAML rule

  AFFECTED: Wing FTP Server all versions before 7.4.4 (Linux, Windows, macOS)
  FIXED IN: Wing FTP Server 7.4.4 (patched July 10, 2025)
  CISA KEV: Active exploitation confirmed - multiple threat actors within 24h of disclosure

