# discoveryprobe-inventory -- agent inventory from source.
#
# Identifies AI agents in a source tree (passport + code heuristics), surfaces
# shadow agents (missing/invalid passport), cross-checks declared vs observed
# behaviour, and maps multi-agent communication.
[package]
name = "discoveryprobe-inventory"
version = "0.1.0"
edition = "2021"
description = "Agent inventory: passport recognition, shadow-agent surfacing, declared-vs-observed conformity, multi-agent comm graph"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discoveryprobe-core = { path = "../discoveryprobe-core" }

[[bin]]
name = "discoveryprobe-inventory"
path = "src/main.rs"
