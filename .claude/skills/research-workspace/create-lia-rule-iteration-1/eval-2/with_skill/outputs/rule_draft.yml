id: A-VULN-MZLA-Firefox-CVE-2024-Windows-ESR128
title: "Mozilla Firefox Windows - Pre-ESR128 Vulnerable Installations (Multiple CVEs)"
metadata:
  created_date: "2026-03-02"
  last_updated: "2026-03-02"
  version: "1.0"
  author: "LIA Security Team"
description: >
  Detects Windows workstations running Mozilla Firefox versions prior to 128.0 (ESR baseline).
  Firefox versions before 128 are affected by multiple critical vulnerabilities including
  CVE-2024-9680 (use-after-free in Animation timelines, CVSS 9.8, CISA KEV),
  CVE-2024-9396 (memory corruption), CVE-2024-9397 (directory listing bypass),
  and dozens of additional CVEs fixed in the Firefox 128 ESR baseline release.
  Firefox ESR 128 is the current long-term support branch recommended for enterprise deployments.
author: LIA Security Team
status: active
target: MOZILLA

