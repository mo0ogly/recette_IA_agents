[project]
name = "python_recette"
version = "0.1.0"
description = "Static recette scorer for AgentRail Python code (blocs A-F + ruff/mypy/bandit/pip-audit gate)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["python_recette"]

# Dogfood the AgentRail Python rules on the tool itself.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I isort, UP pyupgrade, B bugbear, S flake8-bandit,
# SIM simplify, RET returns, PTH use-pathlib.
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert (S101) and the patterns module embeds rule source strings.
"tests/*" = ["S101"]
"python_recette/patterns.py" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
