description: |
  Detects Wing FTP Server installations vulnerable to CVE-2025-47812, a CVSS 10.0 CRITICAL
  unauthenticated Remote Code Execution vulnerability discovered by Julien Ahrens.

  VULNERABILITY MECHANISM - Null Byte Lua Injection:
  - The user and admin web interfaces mishandle '\0' (null byte) characters in the username field
  - NULL byte appended to username terminates strlen() validation prematurely (CWE-158)
  - Lua code following the null byte is written verbatim into the session file
  - SessionModule.load() executes the session file via loadfile(filepath) then f()
  - This triggers arbitrary Lua code execution with root/SYSTEM privileges

  ATTACK FLOW:
  1. POST to /loginok.html with username="validuser\x00<lua_payload>"
  2. Null byte truncates authentication check - login succeeds for valid user portion
  3. Full username string (including Lua payload) written to session file
  4. Attacker requests /dir.html or other authenticated endpoint
  5. SessionModule.load() executes the session file - Lua payload triggers
  6. Arbitrary system commands execute via io.popen() as root/SYSTEM

  AFFECTED SYSTEMS:
  - Wing FTP Server all versions before 7.4.4
  - Linux, Windows, macOS platforms
  - Both user web interface and admin web interface affected

  FIXED IN: Wing FTP Server 7.4.4 (released May 14, 2025 / patched July 10, 2025)

  DETECTION LOGIC (MOTOR_FIX_010 CONFORME):
  - Collection Script: Collect-WingFTPServer.ps1 collecte uniquement les donnees brutes de version
  - YAML Rule: version_lt(VersionNormalized, "7.4.4.0") fait la detection
  - Aucun flag is_vulnerable dans le script PowerShell
  - Logique entierement auditable dans cette regle YAML

author: mo0ogly@proton.me
date: "2026-03-02"
modified: "2026-03-02"
version: "1.0.0"
level: critical
risk_score: 100
severity: critical

# MOTOR_FIX_010 CONFORME:
# - INTERDIT: is_vulnerable: {eq: true}
# - INTERDIT: CVE_2025_47812_is_vulnerable: {eq: true}
# - INTERDIT: check_result: {eq: "FAIL"}
# - CORRECT: version_lt() dans where clause - logique AUDITABLE

object_detection:
  match:
    ObjectClass:
      eq: WingFTPServer

  where:
    condition: and
    rules:
      - ObjectClass:
          eq: WingFTPServer
      - version_lt(VersionNormalized, "7.4.4.0"):
          eq: true

output:
  fields:
    Hostname: Hostname
    Version: Version
    VersionNormalized: VersionNormalized
    Platform: Platform
    AdminPort: AdminPort
    AnonymousFTPEnabled: AnonymousFTPEnabled

  computed:
    Severity: "if(version_lt(VersionNormalized, '7.4.4.0'), 'CRITICAL - CVE-2025-47812 Wing FTP Server Null Byte RCE on ' + Hostname + ' (version ' + Version + ') - CVSS 10.0 - CISA KEV - Total server compromise risk', 'SECURE - Wing FTP Server is patched against CVE-2025-47812')"
    RiskReason: "if(version_lt(VersionNormalized, '7.4.4.0'), 'NULL_BYTE_LUA_INJECTION - CWE-158 - CVSS 10.0 - Null byte in username injects Lua code into session file executed by SessionModule.load() as root/SYSTEM - Exploitable via anonymous FTP - Active exploitation confirmed July 1, 2025 - Exploit-DB 52347 weaponized', 'COMPLIANT - Version >= 7.4.4 is patched against null byte Lua injection')"
    RemediationPriority: "if(version_lt(VersionNormalized, '7.4.4.0'), 'P0_EMERGENCY - Upgrade Wing FTP Server to 7.4.4+ IMMEDIATELY - CISA KEV active exploitation - Disable anonymous FTP as interim measure - Audit session files for Lua payloads - Version detected: ' + Version, 'P4_LOW - No action required - Version ' + Version + ' is patched')"
    RecommendedAction: "if(version_lt(VersionNormalized, '7.4.4.0'), 'PATCH NOW - Download Wing FTP Server 7.4.4+ from https://www.wftpserver.com/download.htm - IMMEDIATE interim: Block web interface (ports 80/443/admin) externally - Disable anonymous FTP - AUDIT session directory for malicious Lua files - SCAN for certutil/cmd.exe child processes of Wing FTP', 'MONITOR - Maintain current patch level >= 7.4.4')"
    DetectionLogic: "if(version_lt(VersionNormalized, '7.4.4.0'), 'VULNERABLE: version_lt(' + VersionNormalized + ', 7.4.4.0) = true - CVE-2025-47812 null byte Lua injection confirmed - Wing FTP Server on ' + Hostname + ' (platform: ' + Platform + ') is vulnerable to unauthenticated RCE', 'SAFE: version_lt(' + VersionNormalized + ', 7.4.4.0) = false - version ' + VersionNormalized + ' is patched (>= 7.4.4.0)')"
    ComplianceImpact: "if(version_lt(VersionNormalized, '7.4.4.0'), 'CRITICAL - CISA KEV active exploitation violates federal patching mandates - CVSS 10.0 breaches NIST CSF ID.RA-1 risk assessment, ISO 27001 A.8.8 vulnerability management, PCI DSS 6.3.3 critical patch requirements - Anonymous FTP exposure violates ANSSI secure configuration baseline', 'LOW - No compliance impact - Wing FTP Server 7.4.4+ applied')"
    AttackSurface: "if(version_lt(VersionNormalized, '7.4.4.0'), 'CRITICAL - Wing FTP Server ' + Hostname + ' (version ' + Version + ', platform ' + Platform + ') exposes unauthenticated RCE via null byte injection at /loginok.html - SessionModule.load() executes injected Lua code as root/SYSTEM - Anonymous FTP=' + AnonymousFTPEnabled + ' (anonymous access = zero-credential exploit path) - T1190 Exploit Public-Facing Application - T1059 Lua code execution - Active exploitation by multiple threat actors since July 1, 2025 (Exploit-DB 52347 weaponized PoC public)', 'SAFE - Version ' + Version + ' is patched (>= 7.4.4.0) - null byte Lua injection fixed')"

