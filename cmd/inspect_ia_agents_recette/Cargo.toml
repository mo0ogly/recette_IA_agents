[package]
name = "inspect_ia_agents_recette"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Static recette scorer for inspect_ia_agents Rust code (blocs A-F + cargo SAST gate, scored report)"
license = "MIT"
publish = false

[[bin]]
name = "inspect_ia_agents_recette"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

# Dogfood the inspect_ia_agents Rust rules on the tool itself.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
