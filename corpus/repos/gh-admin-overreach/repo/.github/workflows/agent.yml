name: infra-sync
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyGithub
      - run: python agent/main.py
        env:
          GITHUB_TOKEN: ${{ secrets.INFRA_SYNCER_PAT }}
