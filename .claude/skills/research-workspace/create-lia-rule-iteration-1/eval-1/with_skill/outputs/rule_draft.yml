id: A-S-WFTP-WingFTP-CVE-2025-47812
title: "Wing FTP Server - Null Byte Lua Code Injection RCE (CVE-2025-47812) - CVSS 10.0 CRITICAL - CISA KEV"
status: stable
target: WingFTPServer

object_type_field: ObjectClass

data_source:
  type: collection
  collection_script: "scripts/collect/wingftp/Collect-WingFTPServer.ps1"
  collection_type: "STANDARD"
  format: json
  required_files:
    - pattern: "wingftp_server_*.json"
      object_class: "WingFTPServer"
      description: "Wing FTP Server version and configuration information"
  fields:
    - ObjectClass
    - Hostname
    - Version
    - VersionNormalized
    - Platform
    - AdminPort
    - AnonymousFTPEnabled

taxonomy:
  taxonomy: WFTP
  taxonomy_short: WFTP
  axis: Security
  axis_short: SECU
  block: Vulnerability Management
  block_short: VULN
  component: CVE-2025-47812
  component_short: CVE47812

cve_info:
  cve_id: "CVE-2025-47812"
  cvss_version: "3.1"
  cvss_score: 10.0
  cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"
  cvss_severity: "CRITICAL"
  is_kev: true
  kev_vendor: "Wing FTP Server"
  kev_product: "Wing FTP Server"
  cwe:
    - "CWE-158"
